name: Verify and publish Portway

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verify per-parking audit snapshot
        run: npm run audit:report-check
      - name: Configure restricted Google satellite key
        env:
          PORTWAY_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.PORTWAY_GOOGLE_MAPS_BROWSER_KEY }}
        run: node scripts/configure_google.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
